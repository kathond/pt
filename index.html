<body>
    <h1>Prompttechnieken</h1>
    <h2><strong>1. Zero-shot prompting</strong></h2>
<p>Geef <strong>geen</strong> voorbeelden mee in je prompt.  Geschikt voor:</p>
    <ul>
      <li> Eenvoudige vragen</li>
      <li> Simpele vertalingen</li>
      <li> Samenvattingen</li>
      <li> Tekst die niet hoeft te voldoen aan bepaalde toon of stijl.</li>
    </ul>
  <p>Voorbeeld: <span class="tekstIsCode">Wat is de hoofdstad van België?</span></p>
